<title>个性化AI日报 · 云音乐APP扫码体验</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23EC4141'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%23B72424'/%3E%3Ccircle cx='13.5' cy='13.5' r='2.2' fill='%23FAFAF7'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --red: #EC4141;
    --red-deep: #D0353C;
    --ink: #17171A;
    --ink-2: #55534E;
    --ink-3: #8F8F89;
    --ink-4: #B4B4AE;
    --paper: #FAFAF7;
    --line: #EFEFE9;
    --font: "MiSans", "PingFang SC", "HarmonyOS Sans SC", "Source Han Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    background: var(--paper);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100svh;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
  }

  .stage { width: 100%; max-width: 500px; }

  /* ── 品牌栏 ─────────────────────────────── */
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin-bottom: 30px;
  }
  .brand-mark { width: 22px; height: 22px; display: block; }
  .brand-mark svg { width: 100%; height: 100%; display: block; }
  .brand-name {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    color: #6B6B66;
  }

  /* ── 标题区 ─────────────────────────────── */
  .title {
    text-align: center;
    font-size: 21px;
    font-weight: 600;
    line-height: 1.5;
    letter-spacing: .3px;
    color: var(--ink);
  }
  .title .hl {
    color: var(--red);
    font-weight: 700;
    padding: 0 2px;
    white-space: nowrap;
    background: linear-gradient(transparent 68%, rgba(236, 65, 65, .12) 0);
    border-radius: 2px;
  }
  .subtitle {
    margin-top: 10px;
    text-align: center;
    font-size: 13px;
    line-height: 1.7;
    color: var(--ink-3);
  }

  /* ── 二维码卡片 ─────────────────────────── */
  .qr-card {
    margin: 30px auto 0;
    width: fit-content;
    background: #FFFFFF;
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 12px 44px rgba(23, 23, 26, .08), 0 1px 0 rgba(23, 23, 26, .03);
  }
  .qr-frame {
    position: relative;
    width: 236px;
    height: 236px;
  }
  .qr-svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .qr-frame .corner {
    position: absolute;
    width: 20px;
    height: 20px;
    border: 3px solid var(--red);
    pointer-events: none;
  }
  .qr-frame .corner.tl { top: -11px; left: -11px; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
  .qr-frame .corner.tr { top: -11px; right: -11px; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
  .qr-frame .corner.bl { bottom: -11px; left: -11px; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
  .qr-frame .corner.br { bottom: -11px; right: -11px; border-left: none; border-top: none; border-radius: 0 0 8px 0; }
  .qr-frame .corners {
    position: absolute;
    inset: -11px;
    animation: breathe 2.4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.035); }
  }

  /* ── 扫描提示 ───────────────────────────── */
  .scan-tip {
    margin-top: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-2);
  }
  .scan-tip svg { width: 16px; height: 16px; display: block; }
  .scan-tip em { font-style: normal; color: var(--ink); font-weight: 600; }

  /* ── 特性标签 ───────────────────────────── */
  .features {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    list-style: none;
  }
  .features li {
    font-size: 12px;
    color: #6B6B66;
    background: #FFFFFF;
    border: 1px solid #E7E7E0;
    border-radius: 999px;
    padding: 5px 13px;
    line-height: 1;
  }

  /* ── 移动端操作区 ───────────────────────── */
  .mobile-cta { display: none; margin-top: 26px; text-align: center; }
  .btn-open {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    max-width: 320px;
    height: 48px;
    margin: 0 auto;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--red), var(--red-deep));
    color: #FFFFFF;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .5px;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(236, 65, 65, .32);
    transition: transform .12s ease, box-shadow .2s ease;
  }
  .btn-open:active { transform: scale(.97); box-shadow: 0 4px 12px rgba(236, 65, 65, .28); }
  .btn-open svg { width: 18px; height: 18px; display: block; }
  .dl-link {
    display: inline-block;
    margin-top: 14px;
    font-size: 12px;
    color: var(--ink-4);
    text-decoration: none;
    transition: color .2s ease;
  }
  .dl-link:hover { color: var(--ink-3); }
  .wake-note {
    display: none;
    margin-top: 10px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--red);
  }
  body.wake-failed .wake-note { display: block; }
  body.wake-failed .dl-link { color: var(--red); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }

  /* ── 底部信息 ───────────────────────────── */
  .foot {
    margin-top: 34px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 11px;
    line-height: 1.8;
    color: var(--ink-4);
  }
  .foot strong { font-weight: 500; color: #A3A39C; }

  /* ── 微信引导浮层 ───────────────────────── */
  .wx-mask {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(17, 17, 19, .78);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }
  .wx-mask.show { display: flex; }
  .wx-card {
    position: relative;
    width: 100%;
    max-width: 300px;
    background: #FFFFFF;
    border-radius: 20px;
    padding: 30px 24px 22px;
    text-align: center;
  }
  .wx-arrow {
    position: absolute;
    top: -46px;
    right: 6px;
    width: 34px;
    height: 34px;
    color: #FFFFFF;
  }
  .wx-card h2 { font-size: 17px; font-weight: 700; color: var(--ink); }
  .wx-card p {
    margin-top: 12px;
    font-size: 13px;
    line-height: 1.9;
    color: var(--ink-2);
  }
  .wx-card p b { font-weight: 600; color: var(--ink); }
  .wx-btn {
    margin-top: 20px;
    width: 100%;
    height: 40px;
    border: none;
    border-radius: 999px;
    background: #F1F1EC;
    color: var(--ink-2);
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }

  /* ── 轻提示 ─────────────────────────────── */
  .toast {
    position: fixed;
    top: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(-12px);
    z-index: 99;
    background: rgba(23, 23, 26, .88);
    color: #fff;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    max-width: 80vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── 响应式 ─────────────────────────────── */
  @media (max-width: 699px) {
    body { padding: 20px 22px calc(28px + env(safe-area-inset-bottom)); align-items: flex-start; padding-top: 48px; }
    .brand { margin-bottom: 26px; }
    .title { font-size: 20px; }
    .qr-card { margin-top: 26px; padding: 18px; }
    .qr-frame { width: min(236px, 62vw); height: min(236px, 62vw); }
    .mobile-cta { display: block; }
    .foot { margin-top: 26px; }
  }
  @media (max-height: 720px) and (max-width: 699px) {
    .features { display: none; }
  }
</style>
</head>

<script>
(function () {
  var WAKE_TARGET = 'https://st.music.163.com/podcast-ai?full_screen=true&nm_style=sbt&type=podcast_detail';
  var DEEP_LINK = 'orpheus://openurl?url=' + encodeURIComponent(WAKE_TARGET);
  var STORE_LINK = 'https://music.163.com/m/download';

  var ua = navigator.userAgent;
  var isInApp = /NeteaseMusic/i.test(ua);
  var isWeixin = /MicroMessenger/i.test(ua);
  var isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua) ||
    (navigator.maxTouchPoints > 1 && Math.min(screen.width, screen.height) < 500);

  /* 已在云音乐App内：直接打开站内页面 */
  if (isInApp) { location.replace(WAKE_TARGET); return; }

  var btn = document.getElementById('btnOpen');
  var toast = document.getElementById('toast');
  var toastTimer = null;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2400);
  }

  /* 唤端可见性追踪 */
  var sawHidden = false;
  document.addEventListener('visibilitychange', function () { if (document.hidden) sawHidden = true; });
  window.addEventListener('pagehide', function () { sawHidden = true; });

  function tryWake() {
    if (isWeixin) {
      document.getElementById('wxMask').classList.add('show');
      return;
    }
    sawHidden = false;
    location.href = DEEP_LINK;
    setTimeout(function () {
      if (!sawHidden && !document.hidden) document.body.classList.add('wake-failed');
    }, 2600);
  }

  /* 移动端：加载后自动尝试唤起云音乐APP */
  if (isMobile && !isWeixin) {
    setTimeout(tryWake, 600);
  }

  btn.addEventListener('click', function () {
    if (isWeixin) {
      document.getElementById('wxMask').classList.add('show');
    } else if (isMobile) {
      document.body.classList.remove('wake-failed');
      tryWake();
    } else {
      showToast('请用手机打开本页，或使用云音乐App扫码体验');
    }
  });

  document.getElementById('wxClose').addEventListener('click', function () {
    document.getElementById('wxMask').classList.remove('show');
  });
})();
</script>
